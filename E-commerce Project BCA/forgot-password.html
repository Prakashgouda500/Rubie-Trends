<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="128x128" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubie Trends | Reset password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(48deg, rgba(234, 69, 47, 0.54) 3%, rgba(63, 0, 251, 0.53) 43%, rgba(63, 0, 251, 0.62) 72%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .reset-container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 28px; font-weight: 800;  color:rgba(234, 69, 47, 0.54);  margin-bottom: 20px; text-decoration: none; display: block; }
        h2 { margin-bottom: 10px; color: #333; }
        p { color: #777; font-size: 14px; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        input:focus { border-color: #2563eb; outline: none; }
        .reset-btn { width: 100%; background: #2563eb; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .reset-btn:hover {  background: linear-gradient(90deg, rgba(36, 24, 199, 0.80) 0%, rgba(2.93, 1.57, 23.29, 0.80) 100%); }
        .footer-link { margin-top: 20px; font-size: 14px; }
        .footer-link a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="reset-container">
    <a href="home.html" class="logo">Rubie Trends</a>
    <h3>Reset Password</h3>
    <p>Verify your identity to set a new password.</p>
    
    <form id="forgotForm">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
            <label>Registered Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" required>
        </div>
        <button type="submit" class="reset-btn">Update Password</button>
    </form>

    <div class="footer-link">
        Remembered it? <a href="login.html">Back to Login</a>
    </div>
</div>

<script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const newPassword = document.getElementById('newPassword').value;

        try {
            const response = await fetch("https://rubie-trends.vercel.app/api/forget-password", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, newPassword })
            });

            const data = await response.json();
            if (data.success) {
                alert("Success! Your password has been updated.");
                window.location.href = 'login.html';
            } else {
                alert(data.message);
            }
        } catch (error) {
            alert("Error connecting to server.");
        }
    });
</script>
</body>
</html>
