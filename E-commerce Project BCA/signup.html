<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="128x128" href="logo.png">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubie Trends | Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
             background: linear-gradient(48deg, rgba(234, 69, 47, 0.54) 3%, rgba(63, 0, 251, 0.53) 43%, rgba(63, 0, 251, 0.62) 72%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .signup-container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
             color:rgba(234, 69, 47, 0.54); /* NexStore Blue */
            margin-bottom: 20px;
        }
        h2 { margin-bottom: 10px; color: #333; }
        p { color: #777; font-size: 14px; margin-bottom: 25px; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #555; }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus { border-color: #007bff; outline: none; }

        .signup-btn {
            width: 100%;
            background: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .signup-btn:hover { background: linear-gradient(90deg, rgba(36, 24, 199, 0.80) 0%, rgba(2.93, 1.57, 23.29, 0.80) 100%); }

        .footer-link { margin-top: 20px; font-size: 14px; }
        .footer-link a { color: #007bff; text-decoration: none; font-weight: 600; }
        .recaptcha-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 20px 0;
}
    </style>
</head>
<body>

<div class="signup-container">
    <div class="logo">Rubie Trends</div>
    <h3>Join Us!</h3>
    <p>Create your account to start shopping.</p>
    
    <form id="signupForm">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <div class="form-group">
            <label>Phone No</label>
            <input type="text" id="phone" placeholder="+91XXXXXXXXXX" required>
        </div>
        <div class="recaptcha-wrapper">
        <div id="recaptcha-container"></div>
        </div>

<button type="button" onclick="sendOTP()">Send OTP</button>

<br><br>

<input type="text" id="otp" placeholder="Enter OTP">

<button type="button" onclick="verifyOTP()">Verify OTP</button>
        <button type="submit" class="signup-btn">Sign Up</button>
    </form>

    <div class="footer-link">
        Already have an account? <a href="login.html">Login</a>
    </div>
</div>

<script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const otp = document.getElementById('otp').value;

        try {
            const response = await fetch('http://localhost:3000/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password, otp })
            });

            const data = await response.json();
            if (data.success) {
                alert("Account created! Let's get you logged in.");
                window.location.href = 'login.html';
            } else {
                alert(data.message);
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Server is not responding. Is your server.js running?");
        }
    });
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } 
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuz39FKg9nUbNgU_0KCY3rJ6qzAxG71lA",
  authDomain: "rubie-otp.firebaseapp.com",
  projectId: "rubie-otp",
  storageBucket: "rubie-otp.firebasestorage.app",
  messagingSenderId: "457835652878",
  appId: "1:457835652878:web:b0ea627bdd2b5c2e32195f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔐 Setup reCAPTCHA
window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
  size: 'normal'
});

// 📲 Send OTP
window.sendOTP = function () {
  const phoneNumber = document.getElementById("phone").value;

  signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier)
    .then((confirmationResult) => {
      window.confirmationResult = confirmationResult;
      alert("OTP Sent!");
    })
    .catch((error) => {
      console.error(error);
      alert(error.message);
    });
};

// ✅ Verify OTP
window.verifyOTP = function () {
  const code = document.getElementById("otp").value;

  window.confirmationResult.confirm(code)
    .then((result) => {
      alert("Login Successful!");
      console.log(result.user);
    })
    .catch((error) => {
      alert("Invalid OTP");
    });
};
</script>
</body>
</html>
